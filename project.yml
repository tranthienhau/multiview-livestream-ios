name: MultiViewStream
options:
  bundleIdPrefix: com.hau
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""

targets:
  MultiViewStream:
    type: application
    platform: iOS
    sources:
      - path: MultiViewStream
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hau.multiviewstream
        INFOPLIST_FILE: MultiViewStream/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - MultiViewStreamTests

  MultiViewStreamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MultiViewStreamTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hau.multiviewstream.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MultiViewStream.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MultiViewStream"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: MultiViewStream
